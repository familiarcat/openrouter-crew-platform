version: '3.8'

services:
  # 1. Shared Memory & Caching (The Warp Core)
  redis:
    image: redis:7-alpine
    container_name: openrouter-crew-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - openrouter-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Workflow Automation Engine (n8n)
  n8n:
    image: n8nio/n8n:latest
    container_name: openrouter-crew-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASE_URL=${N8N_BASE_URL}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_PORT=5678
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      # Database backend pointing to Supabase PostgreSQL
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${SUPABASE_DB_HOST:-db.rpkkkbufdwxmjaerbhbn.supabase.co}
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=postgres
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - DB_POSTGRESDB_SSL_MODE=require
    networks:
      - openrouter-network
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      redis:
        condition: service_healthy

  # 3. Agent Gateways (Crew Runners)
  crew:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
    container_name: openrouter-crew-agents
    restart: unless-stopped
    command: ["/bin/sh", "/app/scripts/start-all-agents.sh"]
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENVIRONMENT=${ENVIRONMENT}
      - NODE_ENV=production
    networks:
      - openrouter-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f mcp-runner > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  openrouter-network:
    driver: bridge

volumes:
  redis_data:
  n8n_data: