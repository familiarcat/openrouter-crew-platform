name: Update Agent Registry

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/agents/**/*.ts'
      - 'domains/**/*.ts'
      - 'scripts/generate-agent-registry.ts'
  workflow_dispatch:

jobs:
  update-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '9.12.3'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Registry
        run: pnpm generate:registry

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update agent registry [skip ci]"
          file_pattern: "domains/alex-ai-universal/dashboard/lib/agents/registry.ts"
          branch: ${{ github.head_ref }}