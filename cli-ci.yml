name: CLI CI

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/crew-cli/**'
      - '.github/workflows/cli-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/crew-cli/**'
      - '.github/workflows/cli-ci.yml'
  workflow_dispatch:

jobs:
  lint_and_type_check:
    name: Lint and Type Check CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm --filter @openrouter-crew/crew-cli lint

      - name: Run TypeScript Type Check
        run: pnpm --filter @openrouter-crew/crew-cli type-check